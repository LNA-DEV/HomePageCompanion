# One container: the admin shell, the API and the website's endpoints, on
# port 8080. Put companion.yaml (and .env) into ./data; "companion migrate"
# writes them from an old installation's data/config.yaml.
services:
  companion:
    build:
      context: .
      dockerfile: Dockerfile
    # or the published image: ghcr.io/lna-dev/homepagecompanion:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
