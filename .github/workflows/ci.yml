name: CI

# Every push and pull request runs the tests; red blocks the merge. Images are
# built and pushed only from main (and version tags), and only after the tests
# passed (docs/concepts/modular-architecture.md §6).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: go vet
        run: scripts/go-each.sh vet ./...
      - name: go test
        run: scripts/go-each.sh test -race ./...
      - name: every package has tests
        run: scripts/check-tests-each.sh
      - name: every module builds on its own
        run: GOWORK=off scripts/go-each.sh build ./...

  # The pre-module companion, until it is removed.
  go-legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: every package has tests
        run: ../scripts/check-tests.sh .notests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: svelte-check (shell and module UIs)
        run: npm run check
      - name: build the shell
        run: npm run build
      - name: build the module UIs
        run: npm run build:modules

  # One image: the shell, the core and every module of build.yaml. Built on
  # every push so a broken image is red too; pushed to GHCR from main and
  # version tags only.
  image:
    needs: [go, go-legacy, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homepagecompanion
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-,format=short
      - name: Build (and push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.PUSH == 'true' }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
